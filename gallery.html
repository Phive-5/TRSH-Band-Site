  <script>document.write('<script src="script.js?v=' + SITE_VERSION + '"><\/script>');</script>
  <script>
    (function() {
      const images = [
        'TRSH-Gallery/536494189_2052628398599275_6473765699219255541_n.jpg',
        'TRSH-Gallery/583235571_18079668794469199_8872860766650832020_n.jpg',
        'TRSH-Gallery/588164443_18082218056469199_5830331112678805686_n.jpg',
        'TRSH-Gallery/589909835_17934465153129471_253369886629241571_n.jpg',
        'TRSH-Gallery/590410868_18081635642469199_6086878782254337937_n.jpg',
        'TRSH-Gallery/590415361_18081635690469199_8076249683092526099_n.jpg',
        'TRSH-Gallery/590420634_18081635654469199_7543784754288186847_n.jpg',
        'TRSH-Gallery/597858911_18081897863469199_8518582298847969517_n.jpg',
        'TRSH-Gallery/602832605_18082593893469199_1719941826955224760_n.jpg',
        'TRSH-Gallery/602905134_18082593881469199_1336704548001962456_n.jpg',
        'TRSH-Gallery/609620399_18084134567469199_282553648184513823_n.jpg',
        'TRSH-Gallery/658751423_18095208446469199_6864248603267980923_n.jpg',
        'TRSH-Gallery/663109051_18095208449469199_2063373163957495661_n.jpg',
        'TRSH-Gallery/670352551_18095319647469199_5405889830189757907_n.jpg',
        'TRSH-Gallery/670403305_18096001712469199_4181939386937975192_n.jpg',
        'TRSH-Gallery/670638899_18096001658469199_8788818079632387471_n.jpg',
        'TRSH-Gallery/670762177_18095208455469199_5399457097227964390_n.jpg',
        'TRSH-Gallery/670776896_18095427221469199_5709934777904340466_n.jpg',
        'TRSH-Gallery/670866312_18095659064469199_1294278255182047712_n.jpg',
        'TRSH-Gallery/670883660_18096001628469199_1467483896501299022_n.jpg',
        'TRSH-Gallery/670971575_18096462524469199_2866719038692652068_n.jpg',
        'TRSH-Gallery/671056805_18095887109469199_4416739204713371641_n.jpg',
        'TRSH-Gallery/671124965_18099056051469199_6315447899163929028_n.jpg',
        'TRSH-Gallery/671144020_18096341075469199_5088010310936932983_n.jpg',
        'TRSH-Gallery/671275661_18096001610469199_5028359906520706262_n.jpg',
        'TRSH-Gallery/671846005_18099056033469199_4195838192902317443_n.jpg',
        'TRSH-Gallery/672390720_18098068136469199_4970320043390145005_n.jpg',
        'TRSH-Gallery/673804961_18096607742469199_2272109435036463664_n.jpg',
        'TRSH-Gallery/673834789_18096607769469199_6861546004077410500_n.jpg',
        'TRSH-Gallery/674522192_18096607760469199_3859666459467344936_n.jpg',
        'TRSH-Gallery/688321744_18098508728469199_7474774894331748704_n.jpg',
        'TRSH-Gallery/724270779_18156929146474901_8042212814127280793_n.jpg',
        'TRSH-Gallery/789236997_18112590416054793_8534841614068955770_n.jpg',
        'TRSH-Gallery/851887523_18221225686352073_4077932604751630079_n.jpg',
        'TRSH-Gallery/853440693_18221225701352073_8963682258473759484_n.jpg',
        'TRSH-Gallery/870167687_18644046589010447_2958715026033657585_n.jpg',
        'TRSH-Gallery/870999102_18644046604010447_755836547240219265_n.jpg',
      ];

      const grid = document.getElementById('galleryGrid');
      const viewer = document.getElementById('fullscreenViewer');
      const viewerImage = document.getElementById('viewerImage');
      const viewerCounter = document.getElementById('viewerCounter');
      const viewerClose = document.getElementById('viewerClose');
      const viewerPrev = document.getElementById('viewerPrev');
      const viewerNext = document.getElementById('viewerNext');
      const imageWrap = document.getElementById('viewerImageWrap');
      const viewerHint = document.getElementById('viewerHint');

      let currentIndex = 0;
      let scale = 1;
      let translateX = 0;
      let translateY = 0;
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragOriginX = 0;
      let dragOriginY = 0;
      let lastTap = 0;
      let pinchDist = 0;

      images.forEach((src, i) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';

        const inner = document.createElement('div');
        inner.className = 'gallery-card-inner';

        const img = document.createElement('img');
        img.className = 'gallery-thumb';
        img.src = src;
        img.alt = 'Gallery image ' + (i + 1);
        img.loading = 'lazy';

        const overlay = document.createElement('div');
        overlay.className = 'gallery-card-overlay';
        const label = document.createElement('span');
        label.className = 'gallery-view-label';
        label.textContent = 'View';
        overlay.appendChild(label);

        inner.appendChild(img);
        inner.appendChild(overlay);
        card.appendChild(inner);

        card.addEventListener('click', () => openViewer(i));
        grid.appendChild(card);
      });

      function openViewer(index) {
        currentIndex = index;
        scale = 1;
        translateX = 0;
        translateY = 0;
        updateImage();
        viewer.classList.add('open');
        document.body.style.overflow = 'hidden';
        if (viewerHint) {
          viewerHint.classList.add('visible');
          setTimeout(() => viewerHint.classList.remove('visible'), 2500);
        }
      }

      function closeViewer() {
        viewer.classList.remove('open');
        document.body.style.overflow = '';
        viewerImage.style.transform = '';
      }

      function updateImage() {
        viewerImage.src = images[currentIndex];
        viewerImage.alt = 'Gallery image ' + (currentIndex + 1);
        viewerCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
        applyTransform();
        viewerPrev.style.display = currentIndex === 0 ? 'none' : '';
        viewerNext.style.display = currentIndex === images.length - 1 ? 'none' : '';
      }

      function applyTransform() {
        viewerImage.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
      }

      function resetZoom() {
        scale = 1;
        translateX = 0;
        translateY = 0;
        applyTransform();
      }

      function navigate(delta) {
        const next = currentIndex + delta;
        if (next < 0 || next >= images.length) return;
        resetZoom();
        currentIndex = next;
        updateImage();
      }

      // --- Navigation controls ---
      viewerPrev.addEventListener('click', function(e) { e.stopPropagation(); navigate(-1); });
      viewerNext.addEventListener('click', function(e) { e.stopPropagation(); navigate(1); });
      viewerClose.addEventListener('click', closeViewer);

      document.addEventListener('keydown', function(e) {
        if (!viewer.classList.contains('open')) return;
        if (e.key === 'Escape') closeViewer();
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
      });

      // --- Zoom: mouse wheel ---
      imageWrap.addEventListener('wheel', function(e) {
        if (!viewer.classList.contains('open')) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.15 : 0.15;
        scale = Math.max(0.5, Math.min(5, scale + delta));
        applyTransform();
      }, { passive: false });

      // --- Zoom: double-click on image wrap toggles zoom ---
      imageWrap.addEventListener('click', function(e) {
        if (e.target !== imageWrap) return;
        const now = Date.now();
        if (now - lastTap < 300) {
          closeViewer();
          lastTap = 0;
          return;
        }
        lastTap = now;
      });

      // Prevent single clicks on the image itself from doing anything unexpected
      viewerImage.addEventListener('click', function(e) {
        e.stopPropagation();
        const now = Date.now();
        if (now - lastTap < 300) {
          closeViewer();
          lastTap = 0;
          return;
        }
        lastTap = now;
      });

      // --- Pan: mouse drag ---
      imageWrap.addEventListener('mousedown', function(e) {
        if (!viewer.classList.contains('open')) return;
        if (e.target !== imageWrap && e.target !== viewerImage) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragOriginX = translateX;
        dragOriginY = translateY;
        imageWrap.style.cursor = 'grabbing';
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        translateX = dragOriginX + (e.clientX - dragStartX);
        translateY = dragOriginY + (e.clientY - dragStartY);
        applyTransform();
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          imageWrap.style.cursor = '';
        }
      });

      // --- Touch support ---
      let touchStartX = 0, touchStartY = 0;
      let touchTranslateX = 0, touchTranslateY = 0;
      let isTouching = false;
      let lastTouchEnd = 0;

      imageWrap.addEventListener('touchstart', function(e) {
        if (!viewer.classList.contains('open')) return;
        if (e.touches.length === 1) {
          isTouching = true;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchTranslateX = translateX;
          touchTranslateY = translateY;
        } else if (e.touches.length === 2) {
          isTouching = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchDist = Math.sqrt(dx * dx + dy * dy);
        }
      });

      imageWrap.addEventListener('touchmove', function(e) {
        if (!viewer.classList.contains('open')) return;
        if (e.touches.length === 1 && isTouching) {
          translateX = touchTranslateX + (e.touches[0].clientX - touchStartX);
          translateY = touchTranslateY + (e.touches[0].clientY - touchStartY);
          applyTransform();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (pinchDist > 0) {
            const delta = (dist - pinchDist) * 0.01;
            scale = Math.max(0.5, Math.min(5, scale + delta));
            applyTransform();
          }
          pinchDist = dist;
        }
      }, { passive: true });

      imageWrap.addEventListener('touchend', function(e) {
        if (!viewer.classList.contains('open')) return;
        if (e.changedTouches.length === 1) {
          const now = Date.now();
          if (now - lastTouchEnd < 300) {
            closeViewer();
            lastTouchEnd = 0;
            return;
          }
          lastTouchEnd = now;
        }
        isTouching = false;
      });

      // Vignette scroll effect
      const hero = document.querySelector('.hero--shows');
      const vignette = document.getElementById('vignette');
      hero.addEventListener('scroll', function() {
        vignette.classList.toggle('vignette--active', hero.scrollTop > 0);
      });
    })();
  </script>
